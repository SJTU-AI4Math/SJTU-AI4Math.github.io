<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shanghai Jiao Tong University AI for Mathematics"
    />
    <link rel="icon" type="image/svg+xml" href="/brand/logo-dark.svg" />
    <link rel="preload" as="image" type="image/webp" href="/img/day_cat.webp" />
    <link rel="preload" as="image" type="image/webp" href="/img/night_cat.webp" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('sjtu-ai4math-theme')
          const theme = stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>SJTU AI4Math</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
